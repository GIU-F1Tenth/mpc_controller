optimized_mpc_controller:
  ros__parameters:
    # Trajectory settings
    enable_trajectory_generation: true
    optimal_trajectory_path: "/home/mohammedazab/ws/src/race_stack/mpc_controller/trajectory/optimal_trajectory.csv"
    reference_trajectory_path: "/home/mohammedazab/ws/src/race_stack/mpc_controller/trajectory/ref_trajectory.csv"

    # Vehicle parameters
    wheelbase: 0.33

    # MPC Horizon
    horizon_N: 8
    horizon_T: 0.8
    lookahead_distance: 0.5

    # Vehicle limits
    max_steering_angle: 0.4
    max_acceleration: 0.8
    max_deceleration: 0.8
    min_speed: 0.1
    max_speed: 1.5

    # Cost function weights
    enable_cost_function_weights: true
    cost_function_weights:
      steering_weight: 1.0
      acceleration_weight: 0.5
      jerk_weight: 0.1
      heading_weight: 2.0
      position_weight: 5.0
      velocity_weight: 1.0

    # Hard constraints
    enable_hard_constraints: false
    hard_constraints:
      max_steering_angle: 0.4
      max_acceleration: 0.8
      max_deceleration: 0.8

    # Obstacle avoidance
    enable_obstacle_avoidance: false
    obstacle_avoidance_weight: 0.5

    # Speed control
    enable_speed_control: true
    speed_control_weight: 0.3

    # Trajectory tracking
    enable_trajectory_tracking: true
    trajectory_tracking_weight: 0.2

    # Safety checks
    enable_safety_checks: false
    safety_check_distance: 0.5

    # Logging
    enable_logging: true

    # Optimized MPC parameters
    mpc_type: "kinematic" # "kinematic" or "dynamic"
    solver_type: "ipopt" # "ipopt" or "sqpmethod"
    control_hz: 20.0

    # Safety Parameters
    safety_timeout: 1.0
    emergency_brake_threshold: 2.0

    # Topics
    odom_topic: "car_state/odom"
    reference_topic: "/mpc/reference_trajectory"
    status_topic: "/mpc/path_ready"
    control_topic: "/drive"

    # QoS
    qos_depth: 10

trajectory_publisher_node:
  ros__parameters:
    # Trajectory file paths
    enable_logging: true
    optimal_trajectory_path: "/home/mohammedazab/ws/src/race_stack/mpc_controller/trajectory/optimal_trajectory.csv"
    reference_trajectory_path: "/home/mohammedazab/ws/src/race_stack/mpc_controller/trajectory/ref_trajectory.csv"
    
    # MPC parameters
    horizon_N: 10
    wheelbase: 0.33
    max_steering_angle: 0.5
    min_speed: 0.1
