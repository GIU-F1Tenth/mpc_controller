optimized_mpc_controller:
  ros__parameters:

    # Vehicle parameters
    wheelbase: 0.33

    # MPC Horizon - Longer for optimized smooth control
    horizon_N: 15
    horizon_T: 1.5
    lookahead_distance: 1.0

    # Vehicle limits - Optimized conservative settings
    max_steering_angle: 0.3
    max_acceleration: 0.5
    max_deceleration: 0.8
    min_speed: 0.05
    max_speed: 3.0

    # Cost function weights - Optimized for smooth control
    enable_cost_function_weights: true
    cost_function_weights:
      steering_weight: 0.3 # Higher penalty for steering
      acceleration_weight: 0.3 # Higher penalty for acceleration
      jerk_weight: 0.5 # Very high penalty for jerky motion
      heading_weight: 0.2 # Moderate heading tracking
      position_weight: 0.3 # Higher position tracking
      velocity_weight: 0.2 # Moderate velocity tracking

    # Hard constraints - Optimized strict limits
    enable_hard_constraints: true
    hard_constraints:
      max_steering_angle: 0.25
      max_acceleration: 0.4
      max_deceleration: 0.6

    # Optimized safety features
    enable_obstacle_avoidance: true
    obstacle_avoidance_weight: 2.0
    enable_speed_control: true
    speed_control_weight: 0.5
    enable_trajectory_tracking: true
    trajectory_tracking_weight: 0.4
    enable_safety_checks: true
    safety_check_distance: 1.0 # Larger safety distance

    # Logging
    enable_logging: true

    # Optimized MPC parameters - Use kinematic for stability
    mpc_type: "kinematic"
    solver_type: "ipopt"
    control_hz: 15.0 # Lower control frequency for stability

    # Safety Parameters - Optimized very strict
    safety_timeout: 2.0
    emergency_brake_threshold: 3.0

    # Topics
    odom_topic: "/odom"
    reference_topic: "/mpc/reference_trajectory"
    status_topic: "/mpc/path_ready"
    control_topic: "/drive"

    # QoS
    qos_depth: 10
