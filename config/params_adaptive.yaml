adaptive_mpc_controller:
  ros__parameters:
    # Vehicle parameters
    wheelbase: 0.33

    # MPC Horizon - Conservative values for testing
    horizon_N: 10  # Reduced for easier solving
    horizon_T: 0.2
    lookahead_distance: 0.3

    # Vehicle limits
    max_steering_angle: 0.5
    max_acceleration: 5
    max_deceleration: 7
    min_speed: 0.1
    max_speed: 8.0  # Reduced max speed

    # Cost function weights - More lenient
    enable_cost_function_weights: true
    cost_function_weights:
      steering_weight: 0.5    # Reduced
      acceleration_weight: 0.3 # Reduced
      jerk_weight: 0.1        # Reduced
      heading_weight: 1.0     # Reduced
      position_weight: 3.0    # Reduced
      velocity_weight: 0.5    # Reduced

    # Safety checks
    enable_safety_checks: true
    safety_check_distance: 0.2

    # MPC parameters
    mpc_type: "kinematic"
    solver_type: "ipopt"
    control_hz: 10  # Reduced frequency

    # Safety Parameters
    safety_timeout: 1.0
    emergency_brake_threshold: 2.0
    obstacle_safety_distance: 0.5

    # Adaptive MPC Parameters - Slower adaptation for stability
    enable_adaptation: true
    adaptation_rate: 0.05  # Slower adaptation
    adaptation_interval: 0.2  # Less frequent adaptation

    # Adaptive parameter bounds - Smaller ranges
    adaptive_bounds:
      horizon_N_min: 5
      horizon_N_max: 15  # Reduced range
      horizon_T_min: 0.12
      horizon_T_max: 0.8
      position_weight_min: 1.5
      position_weight_max: 15.0
      heading_weight_min: 0.8
      heading_weight_max: 8.0
      velocity_weight_min: 0.2
      velocity_weight_max: 4.0
      steering_weight_min: 0.2
      steering_weight_max: 1.5
      acceleration_weight_min: 0.1
      acceleration_weight_max: 1.2

    # Topics
    odom_topic: "/car_state/odom"
    scan_topic: "/scan"
    waypoints_topic: "/global_waypoints"          # Use actual topic
    global_plan_topic: "/horizon_mapper/reference_path"  # Use actual topic  
    reference_topic: "/horizon_mapper/reference_trajectory"
    status_topic: "/horizon_mapper/path_ready"
    control_topic: "/drive"

    # Publishing options
    publish_diagnostics: true
    publish_adaptation_status: true
    publish_predicted_path: true

    # Debug and Logging settings
    debug_logging_enabled: false
    performance_logging_enabled: true
    adaptation_logging_enabled: true
    log_frequency_divider: 5  # More frequent logging for adaptation
