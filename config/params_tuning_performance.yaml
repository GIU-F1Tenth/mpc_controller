optimized_mpc_controller:
  ros__parameters:
    # Performance tuning - racing
    horizon_N: 12
    horizon_T: 0.6
    
    # Vehicle limits - aggressive
    max_steering_angle: 0.5
    max_acceleration: 6.0
    max_deceleration: 5.0
    max_speed: 8.0
    
    # Cost weights - performance focused
    cost_function_weights:
      position_weight: 8.0      # Tight path following
      heading_weight: 4.0       # Precise orientation
      velocity_weight: 2.0      # Good speed tracking
      steering_weight: 0.8      # Allow aggressive steering
      acceleration_weight: 0.3  # Allow quick acceleration
      jerk_weight: 0.1          # Allow rapid changes
    
    # Control frequency
    control_hz: 20.0
    
    # MPC type
    mpc_type: "kinematic"
    solver_type: "ipopt"
