optimized_mpc_controller:
  ros__parameters:
    # Conservative tuning baseline
    horizon_N: 10
    horizon_T: 0.8
    
    # Vehicle limits - conservative
    max_steering_angle: 0.4
    max_acceleration: 3.0
    max_deceleration: 3.0
    max_speed: 6.0
    
    # Cost weights - smooth operation
    cost_function_weights:
      position_weight: 5.0
      heading_weight: 2.0
      velocity_weight: 1.0
      steering_weight: 2.0
      acceleration_weight: 1.0
      jerk_weight: 0.3
    
    # Control frequency
    control_hz: 15.0
    
    # MPC type
    mpc_type: "kinematic"
    solver_type: "ipopt"
